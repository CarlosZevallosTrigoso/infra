<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecturas · lector</title>
<!-- marked (copia local, sin CDN); si faltara, el lector se degrada a texto plano. -->
<script src="marked.umd.js"></script>
<style>
  :root{
    --paper:#ffffff;        /* fondo blanco (toolbox) */
    --panel:#f5f7f2;
    --line:#dfe3da;
    --ink:#1d1f1b;
    --ink-dim:#5b6157;
    --moss:#5a7a3a;         /* acento primario */
    --steel:#4f6b82;
    --warm:#b06a36;
    --mono: "Fira Code", ui-monospace, "SF Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace;
    --serif: "Iowan Old Style", "Charter", Georgia, "Times New Roman", serif;
    --docfs:17px;
    --r:2px;
  }
  /* ---- tema oscuro (paleta czt-bosque en carbón, misma familia que el ordenador de imágenes) ---- */
  body.oscuro{
    --paper:#16170f;
    --panel:#1f2017;
    --line:#33352a;
    --ink:#d8d6c4;
    --ink-dim:#8a8c78;
    --moss:#8fa676;         /* musgo aclarado: bordes y focos legibles sobre carbón */
    --steel:#7d99b0;
    --warm:#c08a5a;
  }
  body.oscuro #doc code{background:#ffffff14}
  body.oscuro #fab{color:#16170f}
  body.oscuro #fab:hover{color:#16170f}
  body.oscuro ::highlight(forja-nota){ background:rgba(143,166,118,.26); }
  body.oscuro ::highlight(forja-activa){ background:rgba(192,138,90,.40); }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:var(--paper); color:var(--ink);
    font-family:var(--mono); font-size:12px; line-height:1.5;
    display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden;
  }

  /* ---- cabecera ---- */
  header{
    display:flex; align-items:center; gap:16px; flex-wrap:wrap; row-gap:8px;
    padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel);
    flex:none;
  }
  #editar.saliendo{ background:var(--warm); color:#f3efe3; border-color:var(--warm) }
  #marca{
    margin:0; font-size:12px; font-weight:600; letter-spacing:.18em; color:var(--ink);
    cursor:pointer; user-select:none; white-space:nowrap;
  }
  #marca:hover{color:var(--moss)}
  #docname{color:var(--ink-dim); font-size:11px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1}
  .acciones{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end}
  button{
    font-family:var(--mono); font-size:11px; letter-spacing:.03em; cursor:pointer;
    border-radius:var(--r); padding:6px 10px; border:1px solid var(--line);
    background:var(--paper); color:var(--ink); transition:border-color .12s, color .12s, opacity .12s;
  }
  button:hover:not(:disabled){border-color:var(--moss); color:var(--moss)}
  button:disabled{opacity:.4; cursor:default}
  #contador{color:var(--ink-dim); font-size:10px; font-variant-numeric:tabular-nums; flex:none; min-width:9ch; text-align:right}

  /* ---- estado inactivo para botones conmutadores ---- */
  .acciones button.inactivo{ opacity:.55; text-decoration:line-through; }

  /* ---- cuerpo: toc + lectura + panel ---- */
  main{display:flex; flex:1; min-height:0}
  #toc{
    width:240px; flex:none; display:none; overflow-y:auto;
    background:var(--panel); border-right:1px solid var(--line);
    padding:14px 8px 24px;
  }
  #toc h2{
    margin:0 0 8px; padding:0 6px; font-size:10px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--ink-dim); font-weight:600;
  }
  .toc-it{
    display:block; padding:3px 6px; cursor:pointer; user-select:none;
    border-left:2px solid transparent; color:var(--ink-dim);
    font-size:11px; line-height:1.45; word-break:break-word;
    transition:color .12s, border-color .12s;
  }
  .toc-it:hover, .toc-it:focus{color:var(--moss); border-left-color:var(--moss); outline:none}
  .toc-it.n2{padding-left:18px}
  .toc-it.n3{padding-left:30px; font-size:10.5px}
  body.editando #toc{display:none !important}
  
  /* ---- reglas de ocultamiento de paneles lateral e índice ---- */
  body.no-toc #toc { display:none !important; }
  body.no-panel #panel { display:none !important; }

  #read{
    flex:1; min-width:0; overflow-y:auto; position:relative;
    overscroll-behavior:contain;
    padding:32px 64px 120px 64px;   /* márgenes simétricos; el número de página cae en el margen izquierdo de la columna */
  }
  #doc{
    max-width:90ch; margin:0 auto;      /* columna centrada en el área de lectura; el ancho se ajusta en «ajustes» */
    font-family:var(--serif); font-size:var(--docfs); line-height:1.75; color:var(--ink);
  }
  #doc.plano{font-family:var(--mono); font-size:13px; line-height:1.6; white-space:pre-wrap}
  #doc h1{font-size:1.7em; line-height:1.2; margin:0 0 .6em}
  #doc h2{font-size:1.35em; margin:1.6em 0 .5em}
  #doc h3{font-size:1.12em; margin:1.4em 0 .4em}
  #doc p{margin:0 0 1.05em; text-align:justify; hyphens:auto}
  #doc em{font-style:italic}
  #doc strong{font-weight:600}
  #doc a{color:var(--steel)}
  #doc blockquote{border-left:2px solid var(--moss); margin:1em 0; padding:.2em 0 .2em 1em; color:var(--ink-dim)}
  #doc code{font-family:var(--mono); font-size:.85em; background:#0000000d; padding:.1em .3em; border-radius:var(--r)}
  #doc ul,#doc ol{padding-left:1.4em; margin:0 0 1.05em}
  #doc li{margin:.2em 0}

  /* resaltado sin mutar el DOM (offsets intactos) */
  ::highlight(forja-nota){ background:rgba(88,106,69,.20); }
  ::highlight(forja-activa){ background:rgba(176,106,54,.34); }

  /* ---- estado vacío ---- */
  #empty{
    max-width:64ch; margin:8vh auto 0; text-align:center; color:var(--ink-dim);
  }
  #drop{
    border:1px dashed var(--line); border-radius:var(--r);
    padding:36px 24px; cursor:pointer; transition:border-color .15s, color .15s;
  }
  #drop.hot{border-color:var(--moss); color:var(--ink)}
  #drop b{display:block; color:var(--ink); font-size:13px; letter-spacing:.02em; margin-bottom:6px}
  #paste{
    width:100%; margin-top:14px; min-height:90px; resize:vertical;
    background:var(--panel); color:var(--ink); border:1px solid var(--line);
    border-radius:var(--r); padding:8px 10px; font-family:var(--mono); font-size:12px;
  }
  #paste:focus{outline:1px solid var(--moss); border-color:var(--moss)}
  #cargarPaste{margin-top:8px}

  /* ---- panel de notas ---- */
  #panel{
    width:560px; max-width:42vw; flex:none; background:var(--panel); border-left:1px solid var(--line);
    display:flex; flex-direction:column; min-height:0;
  }
  #panel h2{
    margin:0; padding:12px 14px; font-size:10px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-dim); border-bottom:1px solid var(--line); font-weight:600;
  }
  #list{overflow-y:auto; padding:6px; flex:1; min-height:0}
  .vacio{color:var(--ink-dim); font-size:11px; padding:16px 10px; line-height:1.5}
  .nota{
    border:1px solid var(--line); border-radius:var(--r); background:var(--paper);
    padding:8px 9px; margin-bottom:8px; transition:border-color .12s;
  }
  .nota.activa{border-color:var(--warm)}
  .quote{
    font-family:var(--serif); font-size:12.5px; line-height:1.4; color:var(--ink);
    border-left:2px solid var(--moss); padding-left:8px; margin-bottom:6px; cursor:pointer;
  }
  .nota.activa .quote{border-left-color:var(--warm)}
  .quote:hover{color:var(--moss)}
  .coments{margin:2px 0 4px}
  .coment{border-left:2px solid var(--line); padding:3px 0 3px 8px; margin:4px 0}
  .coment-tx{font-family:var(--mono); font-size:11.5px; line-height:1.45; color:var(--ink); white-space:pre-wrap; word-break:break-word}
  .coment-meta{display:flex; align-items:center; justify-content:space-between; margin-top:2px; color:var(--ink-dim); font-size:9.5px}
  .cdel{padding:0 5px; font-size:13px; line-height:1; border-color:transparent; background:transparent; color:var(--ink-dim)}
  .cdel:hover{border-color:var(--warm); color:var(--warm)}
  .add{display:flex; gap:6px; margin-top:4px}
  .add-in{flex:1; resize:none; overflow:hidden; min-height:30px; background:transparent; color:var(--ink); border:1px solid var(--line); border-radius:var(--r); padding:5px 6px; font-family:var(--mono); font-size:11.5px; line-height:1.45}
  .add-in:focus{outline:1px solid var(--moss); border-color:var(--moss)}
  .add-btn{flex:none; padding:4px 9px; font-size:10px; align-self:flex-start}
  .fila{display:flex; align-items:center; justify-content:space-between; margin-top:5px; gap:8px}
  .pos{color:var(--ink-dim); font-size:9.5px; font-variant-numeric:tabular-nums; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .del{padding:2px 7px; font-size:10px; flex:none}
  .del:hover{border-color:var(--warm); color:var(--warm)}

  /* ---- botón flotante de selección ---- */
  #fab{
    position:fixed; z-index:50; display:none;
    background:var(--moss); color:#f3efe3; border-color:var(--moss); font-weight:600;
    box-shadow:0 2px 8px #0003; padding:6px 12px;
  }
  #fab.on{display:block}
  #fab:hover{background:var(--warm); border-color:var(--warm); color:#f3efe3}

  /* ---- modo tablet: fab como barra inferior fija + objetivos táctiles ---- */
  body.tablet #fab{ display:none !important; }
  body.tablet .acciones button{ padding:9px 12px; min-height:44px; }
  body.tablet .add-in{ min-height:42px; font-size:13px }
  body.tablet .add-btn{ min-height:42px; padding:9px 13px }
  #tablet.activo{ border-color:var(--moss); color:var(--moss) }
  #anotarBtn{
    display:none; margin:8px; width:calc(100% - 16px);
    padding:13px 12px; font-size:14px; font-weight:600; border-radius:2px;
    background:var(--panel); color:var(--ink-dim); border:1px solid var(--line);
  }
  body.tablet #anotarBtn{ display:block }
  #anotarBtn.lista{ background:var(--moss); color:#f3efe3; border-color:var(--moss) }

  .hide{display:none !important}

  /* ---- sesiones del taller: desplegable y filtro de lectura ---- */
  #sesionesWrap{position:relative}
  #sesiones.parcial{border-color:var(--moss); color:var(--moss)}
  #sesionesPanel{
    position:absolute; top:calc(100% + 6px); right:0; z-index:65;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
    padding:8px 10px; box-shadow:0 4px 12px #0002; min-width:300px;
    display:flex; flex-direction:column; gap:2px;
  }
  #sesionesPanel.hide{display:none}
  #sesionesPanel h3{margin:0 0 6px; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-dim); font-weight:600}
  .ses-row{display:flex; align-items:flex-start; gap:8px; padding:4px 2px; cursor:pointer; user-select:none; font-size:11px; line-height:1.4; color:var(--ink)}
  .ses-row:hover{color:var(--moss)}
  .ses-row input{margin:3px 0 0; accent-color:var(--moss); flex:none}
  .ses-row.off{color:var(--ink-dim)}
  .ses-row .ses-n{font-weight:600; white-space:nowrap}
  .ses-row .ses-d{color:var(--ink-dim); font-size:10px}
  .ses-row.off .ses-d{opacity:.7}
  .ses-acc{display:flex; gap:6px; margin-top:6px; padding-top:6px; border-top:1px solid var(--line)}
  .ses-acc button{flex:1; padding:4px 6px; font-size:10px}
  body.tablet .ses-row{padding:8px 2px; font-size:13px}
  body.tablet .ses-row input{width:18px; height:18px}

  /* texto filtrado: los bloques de una sesión apagada no se muestran (los offsets de texto plano no cambian) */
  body.off-s1 #doc [data-ses="1"], body.off-s2 #doc [data-ses="2"], body.off-s3 #doc [data-ses="3"],
  body.off-s4 #doc [data-ses="4"], body.off-s5 #doc [data-ses="5"]{display:none}
  body.off-s1 #toc .toc-it[data-ses="1"], body.off-s2 #toc .toc-it[data-ses="2"], body.off-s3 #toc .toc-it[data-ses="3"],
  body.off-s4 #toc .toc-it[data-ses="4"], body.off-s5 #toc .toc-it[data-ses="5"]{display:none}
  /* etiqueta de inicio de sesión al margen: pseudoelemento, no altera el texto del documento */
  #doc [data-ses-inicio]{position:relative}
  #doc [data-ses-inicio]::before{
    content:attr(data-ses-inicio); display:block;
    font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--moss); margin:0 0 .6em; padding-top:.6em; border-top:1px solid var(--line);
    user-select:none;
  }
  body.sin-sesiones #doc [data-ses-inicio]::before{display:none}
  #toc .toc-ses{
    margin:10px 6px 2px; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--moss); font-weight:600;
  }
  body.off-s1 #toc .toc-ses[data-ses="1"], body.off-s2 #toc .toc-ses[data-ses="2"], body.off-s3 #toc .toc-ses[data-ses="3"],
  body.off-s4 #toc .toc-ses[data-ses="4"], body.off-s5 #toc .toc-ses[data-ses="5"]{opacity:.45}

  /* ---- glosario: términos subrayados en el texto y panel de entradas ---- */
  #doc .gl{
    text-decoration:underline dotted; text-decoration-color:var(--moss); text-decoration-thickness:1px;
    text-underline-offset:3px; cursor:pointer; transition:background .12s;
  }
  #doc .gl:hover{background:rgba(88,106,69,.12)}
  #doc .gl.gl-activa{text-decoration-style:solid; text-decoration-color:var(--warm); background:rgba(176,106,54,.10)}
  body.oscuro #doc .gl:hover{background:rgba(143,166,118,.16)}
  #doc .gl.gl-alias{text-decoration-color:var(--ink-dim); text-decoration-style:dashed}
  body.sin-glosario #doc .gl:not(.gl-caso){text-decoration:none; cursor:text; background:none}
  /* casos: mismo mecanismo que el glosario, subrayado distinto (doble, color acero) */
  #doc .gl.gl-caso{text-decoration:underline double; text-decoration-color:var(--steel); text-underline-offset:3px}
  #doc .gl.gl-caso:hover{background:rgba(90,110,140,.12)}
  body.sin-casos #doc .gl.gl-caso{text-decoration:none; cursor:text; background:none}
  .gl-sub{font-family:var(--serif); font-style:italic; color:var(--ink-dim); font-size:12px; line-height:1.4; margin-bottom:8px}
  .gl-tags{display:flex; flex-wrap:wrap; gap:4px; margin:0 0 8px}
  .gl-tags span{font-family:var(--mono); font-size:9.5px; border:1px solid var(--line); border-radius:3px; padding:1px 6px; color:var(--ink-dim)}
  .gl-tags span.tipo{color:var(--steel); border-color:var(--steel)}
  .gl-sec{margin-top:12px}
  .gl-sec > b{font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--steel); display:block; margin-bottom:3px}
  .gl-sec .gl-def{font-size:13.5px}
  .gl-sec.gl-dg > b{color:var(--moss)}
  .gl-apar{width:100%; border-collapse:collapse; font-size:11px; margin-top:4px}
  .gl-apar td{vertical-align:top; padding:3px 6px 3px 0; border-top:1px solid var(--line)}
  .gl-apar td.pg{font-family:var(--mono); white-space:nowrap; color:var(--steel)}
  .gl-apar td.pg a{color:var(--steel); cursor:pointer; text-decoration:none}
  .gl-apar td.pg a:hover{color:var(--warm)}
  .gl-apar td.se{color:var(--ink-dim); white-space:nowrap}
  /* análisis: la frase donde se enuncia una tesis, resaltada; su ficha en el panel */
  #doc .gl.gl-tesis{text-decoration:none; background:rgba(176,106,54,.13); box-shadow:inset 0 -2px 0 var(--warm); border-radius:2px}
  #doc .gl.gl-tesis:hover{background:rgba(176,106,54,.24)}
  #doc .gl.gl-tesis.gl-activa{background:rgba(176,106,54,.30)}
  body.sin-analisis #doc .gl.gl-tesis{background:none; box-shadow:none; cursor:text}
  #toggleAna.activo{border-color:var(--warm); color:var(--warm)}
  .gl-num{font-family:var(--mono); font-size:10px; color:var(--warm); letter-spacing:.08em; text-transform:uppercase; margin-bottom:2px}
  .gl-form{font-family:var(--serif); font-size:14px; line-height:1.5; color:var(--ink); border-left:2px solid var(--warm); padding-left:10px; margin:8px 0 10px}
  .gl-sec.gl-letra > b{color:var(--warm)}
  .gl-sec.gl-obj > b{color:var(--ink-dim)}
  .gl-it.gl-it-tesis{border-left-color:transparent; padding-left:6px}
  .gl-it.gl-it-tesis:hover{color:var(--warm); border-left-color:var(--warm)}
  .gl-it.gl-it-sub{font-size:12px; padding-left:18px; color:var(--ink-dim)}
  .gl-it .gl-n{font-family:var(--mono); font-size:9.5px; color:var(--warm); margin-right:6px}
  .gl-it.gl-it-caso{border-left-color:transparent}
  .gl-it.gl-it-caso:hover{color:var(--steel); border-left-color:var(--steel)}
  #glos, #glos *{min-width:0; overflow-wrap:anywhere}
  .gl-desde{font-family:var(--mono); font-size:10px; color:var(--ink-dim); margin:0 0 8px}
  .gl-desde b{color:var(--ink); font-weight:600}
  #glos{display:none; overflow-y:auto; padding:10px 12px 24px; flex:1; min-height:0; font-size:11.5px; line-height:1.5}
  body.modo-glosario #glos{display:block}
  .gl-def{font-size:14.5px; line-height:1.65; max-width:62ch}
  .gl-ent h3{font-size:20px}
  body.modo-glosario #list, body.modo-glosario #anotarBtn{display:none !important}
  #toggleGlos.activo{border-color:var(--moss); color:var(--moss)}
  .gl-nav{display:flex; gap:6px; align-items:center; margin-bottom:10px; flex-wrap:wrap}
  .gl-nav button{padding:3px 8px; font-size:10px}
  .gl-ses{margin:10px 0 3px; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--moss); font-weight:600}
  .gl-it{display:block; padding:3px 4px; cursor:pointer; color:var(--ink); border-left:2px solid transparent; font-family:var(--serif); font-size:13px}
  .gl-it:hover{color:var(--moss); border-left-color:var(--moss)}
  .gl-it small{font-family:var(--mono); color:var(--ink-dim); font-size:9.5px; margin-left:6px}
  .gl-ent h3{margin:4px 0 2px; font-family:var(--serif); font-size:17px; line-height:1.25; font-weight:600; color:var(--ink)}
  .gl-fr{font-family:var(--serif); font-style:italic; color:var(--ink-dim); font-size:12.5px; margin-bottom:8px}
  .gl-meta{border:1px solid var(--line); border-radius:var(--r); padding:6px 8px; margin:8px 0; font-size:10.5px; color:var(--ink-dim); background:var(--paper)}
  .gl-meta b{color:var(--ink); font-weight:600}
  .gl-meta .row{display:flex; gap:6px; margin:2px 0}
  .gl-meta .k{flex:none; min-width:9ch; color:var(--ink-dim)}
  .gl-meta a{color:var(--steel); cursor:pointer; text-decoration:none}
  .gl-meta a:hover{color:var(--warm)}
  .gl-def{font-family:var(--serif); font-size:13.5px; line-height:1.6; color:var(--ink)}
  .gl-def p{margin:0 0 .8em; text-align:justify; hyphens:auto}
  .gl-def em{font-style:italic}
  .gl-conf{border-left:2px solid var(--warm); padding:.2em 0 .2em 10px; margin:10px 0; font-family:var(--serif); font-size:12.5px; line-height:1.5; color:var(--ink)}
  .gl-conf b{font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--warm); display:block; margin-bottom:3px}
  .gl-rel{margin-top:10px}
  .gl-rel b{font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-dim); display:block; margin-bottom:4px}
  .gl-rel button{margin:0 4px 4px 0; padding:3px 7px; font-size:10px}
  body.tablet .gl-it{padding:7px 4px; font-size:15px}
  body.tablet .gl-def{font-size:15px}

  /* ---- marcas de página del libro (anclas <!-- p. N --> del .md) ---- */
  /* el número va siempre al margen izquierdo de la columna, en la línea donde cambia la página:
     la marca es absoluta respecto a #doc (left) pero conserva su posición vertical estática (línea) */
  #doc{position:relative}
  .pg{position:absolute; left:-3.6em; width:3em; height:0; text-align:right; pointer-events:none}
  .pg::before{
    content:attr(data-p); position:relative; top:.2em;
    font-family:var(--mono); font-size:9.5px; color:var(--ink-dim); opacity:.75; user-select:none;
  }
  body.sin-paginas .pg::before{display:none}
  #doc h1 .pg::before, #doc h2 .pg::before{display:none}
  .pg.destino::before{color:var(--warm); opacity:1; font-weight:600}
  #pagActual{color:var(--ink-dim); font-size:11px; font-variant-numeric:tabular-nums; white-space:nowrap}
  #irPag{width:7ch; font-family:var(--mono); font-size:11px; padding:5px 6px; border:1px solid var(--line); border-radius:var(--r); background:var(--paper); color:var(--ink)}
  #irPag:focus{outline:1px solid var(--moss); border-color:var(--moss)}

  /* ---- notas al pie ---- */
  #doc sup.fn a{color:var(--steel); text-decoration:none; font-family:var(--mono); font-size:.72em; padding:0 .1em}
  #doc sup.fn a:hover{color:var(--warm)}
  #doc .fn-def{font-size:.86em; line-height:1.5; margin:0 0 .6em; text-align:left}
  #doc .fn-def:target, #doc .fn-def.destino{background:rgba(176,106,54,.14)}
  #doc .fn-def .fn-n{font-family:var(--mono); color:var(--ink-dim); margin-right:.4em}
  #doc .fn-def .fn-back{color:var(--steel); text-decoration:none; margin-left:.3em}

  /* ---- contador de palabras/caracteres/páginas (esquina inferior derecha) ---- */
  #stats{
    position:fixed; right:12px; bottom:12px; z-index:70; display:none;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
    color:var(--ink-dim); font-size:10px; padding:3px 8px;
    font-variant-numeric:tabular-nums; letter-spacing:.02em; user-select:none;
  }

  /* ---- controles visuales (esquina inferior izquierda) ---- */
  #controlesVis{
    position:fixed; left:12px; bottom:12px; z-index:40; display:none;
  }
  body.editando #controlesVis{display:none !important}
  
  #btnAjustes{
    box-shadow:0 2px 6px #0001;
  }
  
  #ajustesPanel{
    position:absolute; bottom:calc(100% + 8px); left:0;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
    padding:10px 12px; box-shadow:0 4px 12px #0002;
    display:flex; flex-direction:column; gap:12px;
  }
  #ajustesPanel.hide{display:none}
  
  .ajuste-row{
    display:flex; align-items:center; gap:8px;
    color:var(--ink-dim); font-size:10px; user-select:none;
  }
  .ajuste-row input{width:130px; accent-color:var(--moss); margin:0}
  .ajuste-row .val{color:var(--moss); font-variant-numeric:tabular-nums; min-width:4ch; text-align:right}

  /* ---- modo edición ---- */
  body.editando #panel{display:none}
  #editor{
    display:block; width:100%; max-width:120ch; margin:0 auto;
    height:calc(100vh - 130px); height:calc(100dvh - 130px); resize:none;
    background:var(--panel); color:var(--ink); border:1px solid var(--line);
    border-radius:var(--r); padding:16px 18px;
    font-family:var(--mono); font-size:12.5px; line-height:1.65; tab-size:2;
  }
  #editor:focus{outline:1px solid var(--moss); border-color:var(--moss)}

  /* ---- campo de URL en estado vacío ---- */
  .urlrow{display:flex; gap:6px; margin-top:14px}
  .urlrow input{
    flex:1; background:var(--panel); color:var(--ink); border:1px solid var(--line);
    border-radius:var(--r); padding:6px 8px; font-family:var(--mono); font-size:12px; min-width:0;
  }
  .urlrow input:focus{outline:1px solid var(--moss); border-color:var(--moss)}
  #urlEstado{margin-top:6px; font-size:10.5px; color:var(--ink-dim); min-height:14px; text-align:left; line-height:1.4}

  /* ---- modales (subida y carga por URL) ---- */
  .modal{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; background:#0000005c}
  .modal-box{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:16px 18px; width:min(430px,92%)}
  .modal-box h3{margin:0 0 10px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-dim); font-weight:600}
  .modal-box label{display:block; margin:8px 0; color:var(--ink-dim); font-size:11px}
  .modal-box input{width:100%; margin-top:3px; background:var(--paper); color:var(--ink); border:1px solid var(--line); border-radius:var(--r); padding:6px 8px; font-family:var(--mono); font-size:12px}
  .modal-box input:focus{outline:1px solid var(--moss); border-color:var(--moss)}
  .modal-acc{display:flex; gap:8px; margin-top:12px}
  .modal-acc button{flex:1}
  #estado,#urlEstado2{margin-top:10px; font-size:11px; color:var(--ink-dim); min-height:16px; line-height:1.4}
  .nota.huerfana{opacity:.72; border-style:dashed}
  /* ---- añadidos para el lector de lecturas ---- */
  header a.vinc{font-size:11px; color:var(--moss); text-decoration:none; white-space:nowrap; border:1px solid var(--line); border-radius:var(--r); padding:6px 10px; background:var(--paper)}
  header a.vinc:hover{border-color:var(--moss)}

  #elegir{margin:22px auto 0; text-align:left; max-width:64ch}
  #elegir a{display:block; font-family:var(--serif); font-size:16px; color:var(--ink); text-decoration:none; border:1px solid var(--line); border-left:3px solid var(--moss); border-radius:var(--r); padding:12px 14px; margin:0 0 10px}
  #elegir a:hover{border-color:var(--moss)}
  #elegir a small{display:block; font-family:var(--mono); font-size:11px; color:var(--ink-dim); margin-top:4px}
  #doc img{display:none}
  ::highlight(lectura-cita){ background:rgba(240,196,64,.55); }
  /* comentarios fijos (del repo): azul, de solo lectura */
  ::highlight(lectura-fija){ background:rgba(63,111,168,.20); }
  ::highlight(lectura-fija-activa){ background:rgba(63,111,168,.38); }
  .nota.fija{border-color:#9fb8d6; border-left:3px solid #3f6fa8; background:#f4f8fc}

  /* edición en el lugar */

    margin:-8px auto 18px; max-width:90ch; padding:8px 12px; background:#fff8e6; border:1px solid #e6c97a; border-radius:4px; font-size:11px; color:var(--ink)}
  #barraEdicion .msg{flex:1; min-width:200px}
  #barraEdicion #guardarTexto{background:var(--moss); border-color:var(--moss); color:#fff}
  body.editando-texto #doc [contenteditable="true"]{outline:1px dashed #d9cfa8; outline-offset:3px; border-radius:2px; cursor:text}
  body.editando-texto #doc [contenteditable="true"]:focus{outline:2px solid var(--moss); background:#fffdf5}

  body.editando-texto #fab{display:none !important}

  #avisoCita{position:fixed; left:50%; top:70px; transform:translateX(-50%); z-index:80; background:var(--panel); border:1px solid var(--moss); border-radius:4px; padding:6px 12px; font-size:11px; color:var(--ink); box-shadow:0 4px 14px #0002; display:none}
  /* tablet vertical y pantallas estrechas: índice y anotaciones como cajones sobre el texto */
  @media (max-width:1100px){
    main{position:relative}
    #toc{position:absolute; left:0; top:0; bottom:0; z-index:30; width:min(320px,80vw); box-shadow:4px 0 18px #0002}

<body>
  <header>

    <div class="acciones">

      <button id="cargarJson" title="Importar anotaciones desde un .json exportado">importar .json</button>

<script>
(function(){
  'use strict';
  const $ = (id) => document.getElementById(id);
  const docEl = $('doc'), read = $('read'), empty = $('empty');
  const list = $('list'), fab = $('fab'), fileInput = $('file');
  const editor = $('editor');
  const CTX = 32; // caracteres de contexto para prefix/suffix
  const estrecho = ()=> !!(window.matchMedia && matchMedia('(max-width:1100px)').matches);

  let rawMd = '', docText = '', docName = '';
  let annos = [];        // {id, nota, creado, exact, prefix, suffix, start, end, mdStart, mdEnd, mdUnico, range}
  let pending = null;    // captura de la selección en curso
  let activeId = null;
  let editando = false;
  let editandoTexto = false;                 // edición en el lugar, sobre el texto leído
  let mdServidor = null, mdExportado = null; // para avisar de cambios sin exportar
  let docUrl = '';       // URL de origen si el documento se cargó por red; '' si vino de archivo o pegado
  const revs = Object.create(null); // última revisión _rN exportada por nombre base: nunca se repite en la sesión

  // orden de lectura; huérfanas (start null) al final. Único comparador para toda la app.
  const cmpAnnos = (x, y) => (x.start == null ? 1e15 : x.start) - (y.start == null ? 1e15 : y.start);

  // ===== render =====
  function render(md, name){
    rawMd = md; docName = name || 'documento.md';
    annos = []; pending = null; activeId = null;
    docUrl = '';
    if (window.marked && typeof marked.parse === 'function'){
      docEl.innerHTML = marked.parse(preprocesar(md));
      docEl.classList.remove('plano');
    } else {
      docEl.textContent = md;                 // degradación honesta: sin CDN, texto crudo (igual anotable)
      docEl.classList.add('plano');
    }
    // texto plano canónico del documento: base de todos los offsets
    const r = document.createRange();
    r.selectNodeContents(docEl);
    docText = r.toString();
    marcarNotas();
    asignarSesiones();
    marcarGlosario();        // envuelve términos en <span class="gl">: no altera docText (solo nodos de texto)
    indexarPaginas();
    empty.classList.add('hide');
    docEl.style.display = 'block';
    $('docname').textContent = docName;
    setEdicion(false);
    buildToc();
    refreshHighlights(); renderList(); updateChrome();
  }
  // ===== lecturas disponibles =====
  // Cada entrada: archivo dentro de lecturas/, título, desfase de página (página mostrada = n + 1 + desfase,
  // donde n es la marca {n} del .md) y matriz analítica asociada. Para añadir un texto basta con subir
  // su .md a lecturas/ y, si se quiere, agregar aquí una entrada; sin entrada, se abre igual con desfase 0.
  const CARPETA = 'lecturas/';
  const LECTURAS = [
    { archivo:'star-y-ruhleder-1994---steps-towards-an-ecology-of-infrastructure-complex-problems-in-design-and-access-for-large-scale-collaborative-systems.md',
      titulo:'Star y Ruhleder (1994). Steps Towards an Ecology of Infrastructure', desfase:0, nota:'páginas del PDF de la ponencia (1-12)', matriz:'star-ruhleder-1994.html' },
    { archivo:'star-1999---the-ethnography-of-infrastructure.md',
      titulo:'Star (1999). The Ethnography of Infrastructure', desfase:376, nota:'páginas de la revista (377-391)', matriz:'star-1999.html' },
    { archivo:'1-harvey-bruun-jensen-y-morita-2016---introduction-infrastructural-complications.md',
      titulo:'Harvey, Jensen y Morita (2016). Introduction: Infrastructural Complications', desfase:0, nota:'páginas del libro (1-22)', matriz:'harvey-jensen-morita-2016.html' }
  ];
  const PARAMS = new URLSearchParams(location.search);
  const ARCH = (PARAMS.get('f') || '').replace(/^.*\//, '');
  const CONF = LECTURAS.find(x=> x.archivo === ARCH) || { archivo:ARCH, titulo:ARCH, desfase:+(PARAMS.get('d') || 0), matriz:'' };
  let DOC = ARCH ? CARPETA + ARCH : '';
  let minPag = 1;
  function elegirLectura(){
    $('urlEstado').textContent = 'Elige un texto:';
    $('elegir').innerHTML = LECTURAS.map(x=> '<a href="?f=' + encodeURIComponent(x.archivo) + '">' + x.titulo + '<small>' + x.nota + '</small></a>').join('');
  }
  async function cargarLibro(){
    if (!DOC){ elegirLectura(); return; }
    CLAVE = 'adinf-lector-anotaciones:' + ARCH;
    document.title = (CONF.titulo || ARCH) + ' · lector';
    if (CONF.matriz){ $('verMatriz').href = CONF.matriz; $('verMatriz').classList.remove('hide'); }
    $('urlEstado').textContent = 'Cargando ' + ARCH + '…';
    try {
      const res = await fetch(DOC + '?_t=' + Date.now(), { cache:'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const texto = await res.text();
      setGlosario(null, null, null);
      render(texto, ARCH);
      docUrl = DOC; mdServidor = texto; updateChrome();
      cargarGuardadas();
      await cargarFijas();
      listo = true;
      annos.sort(cmpAnnos); refreshHighlights(); renderList(); updateChrome();
      const tit = (texto.match(/^title:\s*(.+)$/m) || [])[1];
      if (tit && !CONF.titulo) document.title = tit + ' · lector';
      const q = PARAMS.get('q'), pg = parseInt(PARAMS.get('p'), 10) || parseInt((location.hash.match(/^#p-(\d+)$/) || [])[1], 10);
      setTimeout(()=>{ if (q) irACita(q, pg); else if (pg) irPagina(pg); }, 60);
    } catch(e){
      $('urlEstado').textContent = 'No se pudo cargar ' + DOC + ' (' + e.message + '). El archivo debe estar en la carpeta lecturas/, junto a lector.html.';
      $('elegir').innerHTML = '';
    }
  }

  // ===== ir a una cita: búsqueda tolerante (minúsculas, sin puntuación) y resaltado =====
  function normMapa(t){
    let out = '', map = [], prevSp = true;
    for (let i = 0; i < t.length; i++){
      const ch = t[i].toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
      if (/[a-z0-9]/.test(ch)){ out += ch; map.push(i); prevSp = false; }
      else if (!prevSp){ out += ' '; map.push(i); prevSp = true; }
    }
    return { out, map };
  }
  function irACita(q, pg){
    const N = normMapa(docText);
    const nq = normMapa(q).out.trim();
    let k = nq ? N.out.indexOf(nq) : -1;
    if (k < 0 && nq.length > 30) k = N.out.indexOf(nq.slice(0, 30));
    if (k < 0){ if (pg) irPagina(pg); avisoCita('no encontré la cita exacta; abrí la página'); return; }
    const len = (k >= 0 && N.out.indexOf(nq) === k) ? nq.length : 30;
    const start = N.map[k], end = N.map[Math.min(k + len - 1, N.map.length - 1)] + 1;
    const mr = makeRange(start, end); if (!mr) { if (pg) irPagina(pg); return; }
    const r = mr.range;
    revelar(r.startContainer);
    const rc = r.getBoundingClientRect(), cc = read.getBoundingClientRect();
    read.scrollTop += (rc.top - cc.top) - 140;
    if (canHL){ CSS.highlights.set('lectura-cita', new Highlight(r)); setTimeout(()=> CSS.highlights.delete('lectura-cita'), 9000); }
    avisoCita('cita resaltada');
  }
  function avisoCita(msg){ const a = $('avisoCita'); a.textContent = msg; a.style.display = 'block'; clearTimeout(avisoCita.t); avisoCita.t = setTimeout(()=> a.style.display = 'none', 2600); }

  // ===== preprocesado del .md del libro: notas al pie y marcas de página =====
  // Las anclas <!-- p. N --> se vuelven <span class="pg"> sin texto propio (no alteran offsets).
  // Las notas [^cap-n] se vuelven superíndices enlazados; las definiciones, párrafos con ancla.
  function preprocesar(md){
    md = md.replace(/^---\n[\s\S]*?\n---\n/, '');   // frontmatter YAML fuera del render
    md = md.replace(/!\[[^\]]*\]\([^)]*\)/g, '');       // imágenes de la conversión (logos de editorial): fuera
    // marcas de página de la conversión: {n} seguido de guiones; página mostrada = n + 1 + desfase
    md = md.replace(/^\{(\d+)\}-{3,}\s*$/gm, (m, n)=> '<!-- p. ' + (+n + 1 + (CONF.desfase || 0)) + ' -->');
    // notas al final ("Notes"): ítems "- N texto" → definiciones enlazables; llamadas [N](#page…) y <sup>N</sup> → enlaces
    const iNotas = md.search(/^#{1,6}\s*\**\s*notes\s*\**\s*$/im);
    if (iNotas > -1){
      const cab = md.slice(0, iNotas);
      let notas = md.slice(iNotas);
      const fin = notas.search(/^#{1,6}\s*\**\s*references\s*\**\s*$/im);
      let resto = ''; if (fin > -1){ resto = notas.slice(fin); notas = notas.slice(0, fin); }
      const vistas = new Set();
      notas = notas.replace(/^-\s+(\d+)\.?\s+(.*)$/gm, (m, n, txt)=>{ vistas.add(n); return '\n[^n-' + n + ']: ' + txt + '\n'; });
      let cuerpo = cab.replace(/\[(\d+)\]\(#page[^)]*\)/g, (m, n)=> vistas.has(n) ? '[^n-' + n + ']' : m)
                      .replace(/<sup>(\d+)<\/sup>/g, (m, n)=> vistas.has(n) ? '[^n-' + n + ']' : m);
      md = cuerpo + notas + resto;
    }
    md = md.replace(/<!--\s*p\.\s*(\d+)(?::[^>]*)?\s*-->/g, (m, n)=> '<span class="pg" id="p-' + n + '" data-p="' + n + '"></span>');
    // ancla de página sola entre párrafos: se pega al párrafo siguiente para no abrir un hueco
    md = md.replace(/\n\n(<span class="pg"[^>]*><\/span>)\n\n(?=[^\s#*<>\[-])/g, '\n\n$1');
    // párrafo cortado por el cambio de página: si el fragmento anterior no cierra frase y el siguiente
    // empieza en minúscula (o paréntesis), se unen en un solo párrafo con la marca de página dentro
    md = md.replace(/(^|\n)([^\n]*[^\s.?!:;"”»)\]>])[ \t]*\n\n(<span class="pg"[^>]*><\/span>)\n?(?=[a-zà-ÿ(])/g, (m, ini, linea, pg)=>
      /^\s*(#|>|\||[-*+]\s|\d+\.\s|<)/.test(linea) ? m : ini + linea + ' ' + pg);
    md = md.replace(/^\[\^([a-z0-9-]+)\]:\s*(.*)$/gm, (m, id, txt)=>{
      const n = id.replace(/^[a-z0-9]+-/, '');
      return '<span class="fn-n">' + n + '.</span>' + txt + ' <a class="fn-back" href="#fnref-' + id + '" title="volver al texto">↩</a>\n<a id="fn-' + id + '" class="fn-def-anchor"></a>';
    });
    md = md.replace(/\[\^([a-z0-9-]+)\](?!:)/g, (m, id)=>{
      const n = id.replace(/^[a-z0-9]+-/, '');
      return '<sup class="fn" id="fnref-' + id + '"><a href="#fn-' + id + '">' + (n.startsWith('ast') ? '*' : n) + '</a></sup>';
    });
    return md;
  }

  // ===== glosario =====
  // glosario.json: { entradas:[{id, termino, patrones[], frances, traducciones{}, sesion, instalacion{seccion,pagina}, paginas[], definicion, confusion, relacionados[]}] }
  let GL = [], glRe = null, glAbierta = null;
  const LIM = '(?<![\\wáéíóúñÁÉÍÓÚÑ])', LIMF = '(?![\\wáéíóúñÁÉÍÓÚÑ])';
  // casos.json: mismo esquema de detección (id, termino, patrones[]); la ficha lleva subtitulo, tipo, etiquetas[],
  // sesiones[], paginas[], apariciones[{paginas,seccion,uso}], caso, lectura, detalles, relectura, sesion_taller, relacionados[].
  // Se funden en GL con esCaso:true: una sola pasada de subrayado, un solo panel.
  // analisis.json: tesis y sub-tesis; cada una lleva anclas [{patron, pagina}] que son frases literales del texto.
  // Se funden en GL con esTesis:true; el patrón ancla se vuelve span.gl-tesis y abre la ficha.
  function setGlosario(json, casos, ana){
    GL = (json && Array.isArray(json.entradas)) ? json.entradas.filter(e=> e && e.id && e.termino) : [];
    const CS = (casos && Array.isArray(casos.entradas)) ? casos.entradas.filter(e=> e && e.id && e.termino) : [];
    for (const c of CS){ c.esCaso = true; GL.push(c); }
    const AN = (ana && Array.isArray(ana.entradas)) ? ana.entradas.filter(e=> e && e.id && e.titulo) : [];
    for (const a of AN){ a.esTesis = true; a.termino = a.titulo; a.patrones = (a.anclas || []).map(x=> x.patron); GL.push(a); }
    // una sola expresión: patrones más largos primero para que la alternancia prefiera el término compuesto
    const pats = [];
    for (const e of GL){
      for (const p of (e.patrones || [])){ try { new RegExp(p); pats.push({ p, e, alias:false }); } catch(err){ console.warn('patrón inválido', e.id, p); } }
      for (const p of (e.alias || [])){ try { new RegExp(p); pats.push({ p, e, alias:true }); } catch(err){ console.warn('alias inválido', e.id, p); } }
    }
    pats.sort((a,b)=> b.p.length - a.p.length);
    glRe = pats.length ? new RegExp(LIM + '(?:' + pats.map(x=> '(' + x.p + ')').join('|') + ')' + LIMF, 'gi') : null;
    glRe && (glRe.pats = pats);

  function marcarGlosario(){
    if (!glRe || docEl.classList.contains('plano')) return;
    const walker = document.createTreeWalker(docEl, NodeFilter.SHOW_TEXT, {
      acceptNode(n){
        if (!n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        const p = n.parentElement;
        if (!p || p.closest('h1, h2, h3, .gl, .pg, sup.fn, a.fn-back, .fn-n')) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    const nodos = []; let n; while ((n = walker.nextNode())) nodos.push(n);
    let total = 0;
    for (const tn of nodos){
      const s = tn.nodeValue; glRe.lastIndex = 0;
      let m, last = 0, frag = null;
      while ((m = glRe.exec(s))){
        if (!frag) frag = document.createDocumentFragment();
        let k = 1; while (k < m.length && m[k] === undefined) k++;
        const pt = glRe.pats[k - 1], e = pt.e;
        if (m.index > last) frag.appendChild(document.createTextNode(s.slice(last, m.index)));
        const sp = document.createElement('span');
        sp.className = 'gl' + (pt.alias ? ' gl-alias' : '') + (e.esCaso ? ' gl-caso' : '') + (e.esTesis ? ' gl-tesis' : ''); sp.dataset.id = e.id;
        sp.title = pt.alias ? ('ver: ' + e.termino) : e.termino; sp.textContent = m[0];
        frag.appendChild(sp); last = m.index + m[0].length; total++;
        if (!m[0].length) glRe.lastIndex++;
      }
      if (frag){ if (last < s.length) frag.appendChild(document.createTextNode(s.slice(last))); tn.parentNode.replaceChild(frag, tn); }
    }
    docEl.dataset.glTotal = total;
  }

  // ===== sesiones del taller =====
  // Cada sesión se define por secciones (capítulo romano + número de sección), no por páginas.
  // La sesión 4 cruza de capítulo: III.9–11 + IV.1–3. El apéndice va con la 5.
  const SESIONES = [];   // sin sesiones de taller en este lector
  const sesOff = new Set();   // sesiones apagadas
  function sesionDe(cap, sec){ const s = SESIONES.find(x=> x.dentro(cap, sec)); return s ? s.n : null; }
  function capDe(h2){
    const t = h2.textContent;
    const m = t.match(/^Capítulo\s+(I{1,3}|IV)\b/); if (m) return m[1];
    if (/^Apéndice/.test(t)) return 'AP';
    if (/^Notas/.test(t)) return 'NOTAS';
    return null;
  }
  // Recorre los bloques de primer nivel de #doc y les asigna data-ses. Las notas al pie heredan la
  // sesión del pasaje que las llama. Los pseudoelementos y atributos no alteran docText.
  function asignarSesiones(){
    let cap = null, sec = 0, ses = null;
    const inicios = new Set();
    for (const el of docEl.children){
      if (el.tagName === 'H1'){ el.removeAttribute('data-ses'); continue; }
      if (el.tagName === 'H2'){
        cap = capDe(el); sec = 0;
        // el título de capítulo va con la sesión de su primera sección
        ses = (cap === 'NOTAS' || cap == null) ? null : sesionDe(cap, 1);
      } else if (el.tagName === 'H3'){
        const m = el.textContent.match(/^\s*(\d+)\./); if (m) sec = +m[1];
        ses = (cap === 'NOTAS' || cap == null) ? null : sesionDe(cap, sec);
      }
      if (cap === 'NOTAS') break;        // las notas se asignan después, por referencia
      el.removeAttribute('data-ses-inicio');
      if (ses == null) el.removeAttribute('data-ses'); else el.dataset.ses = ses;
    }
    // una marca de página sola justo antes de un título pertenece a la sección que empieza en esa página
    for (const el of docEl.children){
      const nx = el.nextElementSibling;
      if (el.tagName === 'P' && !el.textContent.trim() && el.querySelector('.pg') && nx && /^H[23]$/.test(nx.tagName) && nx.dataset.ses)
        el.dataset.ses = nx.dataset.ses;
    }
    // etiqueta de inicio: primer bloque de cada sesión
    for (const el of docEl.children){
      const s = +el.dataset.ses; if (!s || inicios.has(s) || !el.textContent.trim()) continue;
      inicios.add(s);
      const S = SESIONES[s-1];
      el.dataset.sesInicio = 'Sesión ' + S.n + ' · ' + S.secs + ' · pp. ' + S.pp;
    }
    // notas al pie: sesión del párrafo donde está la llamada
    docEl.querySelectorAll('.fn-def').forEach(p=>{
      const id = p.id.replace(/^fn-/, '');
      const ref = document.getElementById('fnref-' + id);
      const blk = ref && ref.closest('#doc > *');
      if (blk && blk.dataset.ses) p.dataset.ses = blk.dataset.ses; else p.removeAttribute('data-ses');
    });
    aplicarSesiones();
  }
  function aplicarSesiones(){
    for (const S of SESIONES) document.body.classList.toggle('off-s' + S.n, sesOff.has(S.n));
    $('sesiones').classList.toggle('parcial', sesOff.size > 0);
    $('sesiones').textContent = sesOff.size ? ('sesiones ' + (SESIONES.length - sesOff.size) + '/' + SESIONES.length) : 'sesiones';
    renderSesionesLista();
    indexarPaginas();

  function renderSesionesLista(){
    const box = $('sesionesLista'); box.innerHTML = '';
    for (const S of SESIONES){
      const row = document.createElement('label');
      row.className = 'ses-row' + (sesOff.has(S.n) ? ' off' : '');
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !sesOff.has(S.n);
      cb.addEventListener('change', ()=>{ cb.checked ? sesOff.delete(S.n) : sesOff.add(S.n); guardarSesiones(); aplicarSesiones(); });
      const tx = document.createElement('span');
      tx.innerHTML = '<span class="ses-n">Sesión ' + S.n + '</span> · ' + S.titulo + '<br><span class="ses-d">' + S.secs + ' · pp. ' + S.pp + '</span>';
      row.append(cb, tx);
      box.appendChild(row);
    }
  }
  function guardarSesiones(){ try { localStorage.setItem('antiedipo-sesiones-off', JSON.stringify([...sesOff])); } catch(e){} }
  (function(){
    try { const t = localStorage.getItem('antiedipo-sesiones-off'); if (t) JSON.parse(t).forEach(n=>{ if (SESIONES.some(S=> S.n === n)) sesOff.add(n); }); } catch(e){}
  })();

  $('sesionesPanel').addEventListener('click', e=> e.stopPropagation());

  $('sesTodas').addEventListener('click', ()=>{ sesOff.clear(); guardarSesiones(); aplicarSesiones(); });

  // offset de un punto (nodo, offset) dentro de docEl, medido en el mismo espacio que docText
  function pointOffset(node, offset){
    const r = document.createRange();
    r.selectNodeContents(docEl);
    try { r.setEnd(node, offset); } catch(e){ return null; }
    return r.toString().length;
  }

  // ===== captura de selección =====
  function captureSelection(){
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || sel.rangeCount === 0) return null;
    const range = sel.getRangeAt(0);
    if (range.collapsed) return null;
    if (!docEl.contains(range.commonAncestorContainer)) return null; // solo dentro del texto
    const start = pointOffset(range.startContainer, range.startOffset);
    const end   = pointOffset(range.endContainer, range.endOffset);
    if (start == null || end == null || end <= start) return null;
    const exact = docText.slice(start, end);
    if (!exact.trim()) return null;
    const prefix = docText.slice(Math.max(0, start - CTX), start);
    const suffix = docText.slice(end, end + CTX);
    const md = mdOffset(exact);
    return {
      range: range.cloneRange(), exact, prefix, suffix, start, end,
      mdStart: md.start, mdEnd: md.end, mdUnico: md.unico
    };
  }

  // offset best-effort en el .md crudo: sirve si la selección aparece verbatim en la fuente
  function mdOffset(exact){
    const first = rawMd.indexOf(exact);
    if (first === -1) return { start:null, end:null, unico:false };
    const second = rawMd.indexOf(exact, first + 1);
    return { start:first, end:first + exact.length, unico: second === -1 };
  }

  // ===== re-anclaje (para importar .json) =====
  function pointFromOffset(target){
    target = Math.max(0, Math.min(target, docText.length));
    const walker = document.createTreeWalker(docEl, NodeFilter.SHOW_TEXT, null);
    let acc = 0, node, last = null;
    while ((node = walker.nextNode())){
      const len = node.nodeValue.length;
      if (acc + len >= target) return { node, offset: target - acc };
      acc += len; last = node;
    }
    return last ? { node: last, offset: last.nodeValue.length } : null;
  }
  function makeRange(start, end){
    const a = pointFromOffset(start), b = pointFromOffset(end);
    if (!a || !b) return null;
    const r = document.createRange();
    try { r.setStart(a.node, a.offset); r.setEnd(b.node, b.offset); } catch(e){ return null; }
    return { range: r, start, end };
  }
  function commonSuffixLen(a, b){ let i=0; while(i<a.length && i<b.length && a[a.length-1-i]===b[b.length-1-i]) i++; return i; }
  function commonPrefixLen(a, b){ let i=0; while(i<a.length && i<b.length && a[i]===b[i]) i++; return i; }
  function findByQuote(exact, prefix, suffix){
    const hits = []; let i = docText.indexOf(exact);
    while (i !== -1){ hits.push(i); i = docText.indexOf(exact, i + 1); }
    if (!hits.length) return null;
    if (hits.length === 1) return { start: hits[0], end: hits[0] + exact.length };
    let best = hits[0], score = -1;
    for (const s of hits){
      const pre = docText.slice(Math.max(0, s - prefix.length), s);
      const suf = docText.slice(s + exact.length, s + exact.length + suffix.length);
      const sc = commonSuffixLen(pre, prefix) + commonPrefixLen(suf, suffix);
      if (sc > score){ score = sc; best = s; }
    }
    return { start: best, end: best + exact.length };
  }
  function resolveAnchor(obj){
    const exact = obj.exact || '';
    const tp = obj.textoPlano || {};
    if (exact && Number.isInteger(tp.start) && Number.isInteger(tp.end) && docText.slice(tp.start, tp.end) === exact)
      return makeRange(tp.start, tp.end);
    if (exact){ const h = findByQuote(exact, obj.prefix || '', obj.suffix || ''); if (h) return makeRange(h.start, h.end); }
    if (Number.isInteger(tp.start) && Number.isInteger(tp.end) && tp.end > tp.start && tp.end <= docText.length)
      return makeRange(tp.start, tp.end);
    return null;
  }

  // ===== modo edición =====
  function reanclar(){
    let ok = 0, huerf = 0;
    for (const a of annos){
      const anc = resolveAnchor({
        exact: a.exact, prefix: a.prefix, suffix: a.suffix,
        textoPlano: (a.start != null && a.end != null) ? { start: a.start, end: a.end } : null
      });
      const valido = anc && a.exact && docText.slice(anc.start, anc.end) === a.exact;
      if (valido){
        a.start = anc.start; a.end = anc.end; a.range = anc.range; a.huerfana = false;
        a.prefix = docText.slice(Math.max(0, a.start - CTX), a.start);
        a.suffix = docText.slice(a.end, a.end + CTX);
        ok++;
      } else {
        a.start = null; a.end = null; a.range = null; a.huerfana = true; huerf++;
      }
      const md = a.exact ? mdOffset(a.exact) : { start:null, end:null, unico:false };
      a.mdStart = md.start; a.mdEnd = md.end; a.mdUnico = md.unico;
    }
    return { ok, huerf };
  }

  function setEdicion(on){
    editando = on;
    document.body.classList.toggle('editando', on);
    editor.classList.toggle('hide', !on);
    docEl.style.display = on ? 'none' : 'block';
    $('editar').textContent = on ? 'volver a lectura' : 'editar';
    $('editar').classList.toggle('saliendo', on);
    hideFab();
    updateChrome();
  }

  function aplicarNuevoTexto(nuevo, nombre){
    const snapshot = annos;
    render(nuevo, nombre);
    annos = snapshot;
    const r = reanclar();
    annos.sort(cmpAnnos);
    refreshHighlights(); renderList(); updateChrome();
    return r;

  function aplicarEdicion(nuevo){

      alert(r.ok + ' re-ancladas, ' + r.huerf + ' sin anclar (huérfanas): su pasaje cambió o desapareció. Siguen en la lista y se re-anclan solas si el texto reaparece.');
  }

  function alternarCodigo(){
    if (!rawMd) return;
    if (!editando){
      editor.value = rawMd;
      setEdicion(true);
      editor.focus();
    } else {
      const nuevo = editor.value;

      aplicarEdicion(nuevo);

  // ===== edición en el lugar: se escribe sobre el texto leído y los cambios se trasladan al .md =====
  // Cada bloque (párrafo, título, ítem) se vuelve editable. Al guardar, se compara palabra por palabra el
  // texto anterior y el nuevo, y cada cambio se busca en el .md por su contexto (palabras vecinas), tolerando
  // marcas de Markdown, llamadas a notas y saltos. Los cambios que no se pueden ubicar sin ambigüedad no se
  // aplican y se informan, para hacerlos en «editar código».
  const originales = new Map();
  const NOEDIT = 'sup.fn, a.fn-back, .fn-n, .pg';
  function bloquesEditables(){
    return [...docEl.querySelectorAll('p, h1, h2, h3, h4, h5, h6, li')].filter(el => {
      const anc = el.parentElement && el.parentElement.closest('p, h1, h2, h3, h4, h5, h6, li');
      return !(anc && docEl.contains(anc)) && el.textContent.trim();
    });
  }
  function textoDe(el){
    const c = el.cloneNode(true);
    c.querySelectorAll(NOEDIT).forEach(x => x.remove());
    c.querySelectorAll('li').forEach(x => x.remove());
    return c.textContent.replace(/\s+/g, ' ').trim();
  }
  function entrarTexto(){
    if (!rawMd || editando) return;
    editandoTexto = true; originales.clear();
    document.body.classList.add('editando-texto');
    hideFab(); setAnotar(false); pending = null;
    for (const el of bloquesEditables()){
      originales.set(el, textoDe(el));
      el.contentEditable = 'true'; el.spellcheck = true;
      el.querySelectorAll(NOEDIT).forEach(x => x.contentEditable = 'false');
    }
    $('barraEdicion').classList.remove('hide');
    $('editar').textContent = 'guardar'; $('editar').classList.add('activo');
    updateChrome();
  }
  function salirTexto(){
    editandoTexto = false;
    document.body.classList.remove('editando-texto');
    docEl.querySelectorAll('[contenteditable]').forEach(el => el.removeAttribute('contenteditable'));
    docEl.querySelectorAll('.editado').forEach(el => el.classList.remove('editado'));
    $('barraEdicion').classList.add('hide');
    $('editar').textContent = 'editar'; $('editar').classList.remove('activo');
    originales.clear();
    updateChrome();
  }
  function hayCambios(){ for (const [el, v] of originales) if (textoDe(el) !== v) return true; return false; }
  function descartarTexto(){
    if (hayCambios() && !confirm('¿Descartar los cambios hechos sobre el texto?')) return;

  // diferencia por palabras (subsecuencia común más larga) → tramos cambiados
  function tramos(a, b){
    const n = a.length, m = b.length, W = m + 1, L = new Uint32Array((n + 1) * W);
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
      L[i*W + j] = a[i] === b[j] ? L[(i+1)*W + j + 1] + 1 : Math.max(L[(i+1)*W + j], L[i*W + j + 1]);
    const out = []; let i = 0, j = 0, cur = null;
    while (i < n || j < m){
      if (i < n && j < m && a[i] === b[j]){ if (cur){ out.push(cur); cur = null; } i++; j++; }
      else {
        if (!cur) cur = { a0:i, a1:i, b0:j, b1:j };
        if (j < m && (i >= n || L[i*W + j + 1] >= L[(i+1)*W + j])){ j++; cur.b1 = j; }
        else { i++; cur.a1 = i; }
      }
    }
    if (cur) out.push(cur);
    return out;
  }
  const escRe = t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  // separador entre palabras en el .md: espacios, énfasis, llamadas a notas, comentarios y marcas de página
  const SEP = '(?:\\s|[*_]|<sup>[^<]*</sup>|\\[\\^?[\\w-]+\\](?:\\(#[^)]*\\))?|<!--[^>]*-->|\\{\\d+\\}-+)+';
  function patTok(t){
    const m = t.match(/^([^A-Za-z0-9À-ÿ]*)(.*?)([^A-Za-z0-9À-ÿ]*)$/);
    if (!m || !m[2]) return escRe(t);
    return escRe(m[1]) + '[*_]{0,2}' + escRe(m[2]) + '[*_]{0,2}' + escRe(m[3]);
  }
  const patSeq = ts => ts.map(patTok).join(SEP);
  // Reescribe el tramo del .md que corresponde a las palabras viejas conservando lo que no es texto:
  // marcas de página, llamadas a notas y comentarios quedan en su sitio, y las cursivas de cada palabra
  // se mantienen cuando se cambia palabra por palabra.
  const protegido = sep => sep.replace(/[\s*_]/g, '') !== '';
  function rehacerMedio(txt, viejo, nuevas){
    const re = new RegExp('^' + viejo.map(t => '(' + patTok(t) + ')').join('(' + SEP + ')') + '$');
    const g = txt.match(re);
    if (!g) return nuevas.join(' ');
    const toks = [], seps = [];
    for (let i = 1; i < g.length; i++) (i % 2 ? toks : seps).push(g[i]);
    const conMarcas = (orig, nueva) => {
      const ini = (orig.match(/^[^A-Za-z0-9À-ÿ]*/) || [''])[0].match(/[*_]+$/), fin = (orig.match(/[^A-Za-z0-9À-ÿ]*$/) || [''])[0].match(/^[*_]+/);
      const core = nueva.match(/^([^A-Za-z0-9À-ÿ]*)(.*?)([^A-Za-z0-9À-ÿ]*)$/);
      if (!core || !core[2] || (!ini && !fin)) return nueva;
      return core[1] + (ini ? ini[0] : '') + core[2] + (fin ? fin[0] : '') + core[3];
    };
    if (nuevas.length === toks.length){
      let out = '';
      toks.forEach((t, i) => { out += conMarcas(t, nuevas[i]); if (i < seps.length) out += seps[i]; });
      return out;
    }
    // distinto número de palabras: las nuevas van en orden y cada separador protegido queda en la posición proporcional
    const prot = seps.map((sp, i) => ({ sp, i })).filter(x => protegido(x.sp));
    if (!nuevas.length) return prot.map(x => x.sp).join('');
    let out = '';
    nuevas.forEach((w, j) => {
      out += w;
      if (j < nuevas.length - 1){
        const aqui = prot.filter(x => Math.min(nuevas.length - 2, Math.round((x.i + 1) * nuevas.length / toks.length) - 1) === j);
        out += aqui.length ? aqui.map(x => x.sp).join('') : ' ';
      }
    });
    const sobran = prot.filter(x => Math.min(nuevas.length - 2, Math.round((x.i + 1) * nuevas.length / toks.length) - 1) < 0 || nuevas.length < 2);
    return out + sobran.map(x => x.sp).join('');
  }
  function aplicarTramo(md, a, b, h){
    const viejo = a.slice(h.a0, h.a1), nuevo = b.slice(h.b0, h.b1).join(' ');
    const intentar = k => {
      const izq = a.slice(Math.max(0, h.a0 - k), h.a0), der = a.slice(h.a1, h.a1 + k);
      if (!viejo.length && !izq.length && !der.length) return { n:0 };
      let re;
      if (viejo.length){
        re = new RegExp('(' + (izq.length ? patSeq(izq) + SEP : '') + ')(' + patSeq(viejo) + ')(' + (der.length ? SEP + patSeq(der) : '') + ')', 'g');
      } else {
        re = new RegExp('(' + patSeq(izq) + ')(' + (izq.length && der.length ? SEP : '') + ')(' + patSeq(der) + ')', 'g');
      }
      const ms = [...md.matchAll(re)];
      if (ms.length !== 1) return { n: ms.length };
      const m = ms[0];
      let rep;
      if (viejo.length){
        const medio = rehacerMedio(m[2], viejo, nuevo ? nuevo.split(' ') : []);
        if (medio) rep = (m[1] + medio + m[3]).replace(/[ \t]*(\n\n\{\d+\}-{3,}\n\n)[ \t]*/g, '$1');
        else rep = m[1].length ? m[1].replace(/\s+$/, '') + m[3] : m[3].replace(/^\s+/, '');
      } else {
        if (izq.length && der.length) rep = m[1] + m[2] + nuevo + ' ' + m[3];
        else if (izq.length) rep = m[1] + ' ' + nuevo;
        else rep = nuevo + ' ' + m[3];
      }
      return { n:1, md: md.slice(0, m.index) + rep + md.slice(m.index + m[0].length) };
    };
    let r = intentar(2);
    for (const k of [3, 4, 6, 9]) { if (r.n <= 1) break; r = intentar(k); }
    if (r.n === 0){ for (const k of [1, 0]) { r = intentar(k); if (r.n === 1) break; } }
    return r.n === 1 ? { ok:true, md:r.md } : { ok:false, motivo: r.n === 0 ? 'no se encontró en el .md' : 'aparece más de una vez' };
  }

  // ===== importar .json =====
  function importJSON(text, fname, silencioso){
    let data;
    try { data = JSON.parse(text); } catch(e){ alert('JSON inválido: ' + e.message); return; }
    const items = Array.isArray(data) ? data : (data.anotaciones || []);
    if (!items.length){ if (!silencioso) alert('El .json no contiene anotaciones reconocibles.'); return; }
    if (!rawMd){ alert('Carga primero el documento .md correspondiente: las anotaciones se anclan sobre su texto.'); return; }
    if (!silencioso && data.documento && data.documento.hashMd && data.documento.hashMd !== hash32(rawMd)){
      if (!confirm('El .json se generó sobre otro documento (hash distinto). Intento relocalizar por contexto de todos modos. ¿Continuar?')) return;
    }
    let ok = 0, huerf = 0, dup = 0;
    for (const it of items){
      const obj = it.objetivo || it;
      const id = it.id || ('a' + Date.now().toString(36) + Math.random().toString(36).slice(2,6));
      if (annos.some(a => a.id === id)){ dup++; continue; }
      const anc = resolveAnchor(obj);
      const tp = obj.textoPlano || {};
      let coments = [];
      if (Array.isArray(it.comentarios))
        coments = it.comentarios.filter(c => c && typeof c.texto === 'string' && c.texto.trim())
                                .map(c => ({ texto: c.texto, creado: c.creado || new Date().toISOString() }));
      else if (typeof it.nota === 'string' && it.nota.trim())
        coments = [{ texto: it.nota, creado: it.creado || new Date().toISOString() }];
      const a = {
        id, comentarios: coments, creado: it.creado || new Date().toISOString(),
        exact: obj.exact || '', prefix: obj.prefix || '', suffix: obj.suffix || '',
        start: anc ? anc.start : (Number.isInteger(tp.start) ? tp.start : null),
        end:   anc ? anc.end   : (Number.isInteger(tp.end)   ? tp.end   : null),
        range: anc ? anc.range : null,
        huerfana: !anc
      };
      const md = a.exact ? mdOffset(a.exact) : { start:null, end:null, unico:false };
      a.mdStart = md.start; a.mdEnd = md.end; a.mdUnico = md.unico;
      annos.push(a); anc ? ok++ : huerf++;

  }

  let fijas = [], fijasTexto = null;
  async function cargarFijas(){
    fijas = [];
    const url = CARPETA + ARCH.replace(/\.(md|markdown|txt)$/i, '') + '.comentarios.json';
    try {
      const r = await fetch(url + '?_t=' + Date.now(), { cache:'no-store' });
      if (!r.ok) return;
      const data = await r.json();
      const items = Array.isArray(data) ? data : (data.anotaciones || []);
      fijas = items.map(it => {
        const obj = it.objetivo || it;
        return { id: it.id || ('f' + Math.random().toString(36).slice(2, 8)), exact: obj.exact || '', prefix: obj.prefix || '', suffix: obj.suffix || '', textoPlano: obj.textoPlano || null,
                 comentarios: (it.comentarios || []).filter(c => c && c.texto) };
      }).filter(f => f.exact);

      const ids = new Set(fijas.map(f => f.id));

        const c = { texto: t, creado: new Date().toISOString() };
        a.comentarios.push(c);
        coments.appendChild(commentNode(a, c));
        ta.value = ''; autoGrow(ta); ta.focus();
        updateChrome();
      };
      ta.addEventListener('keydown', e=>{
        if (e.isComposing || e.keyCode === 229) return;
        if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); doAdd(); }
      });
      const btn = document.createElement('button');
      btn.className = 'add-btn'; btn.textContent = 'añadir';
      btn.addEventListener('click', doAdd);
      add.append(ta, btn);

      const fila = document.createElement('div');
      fila.className = 'fila';
      const pos = document.createElement('span');
      pos.className = 'pos';
      pos.textContent = (a.huerfana || a.start == null)
        ? 'sin anclar en este documento'
        : ('plano ' + a.start + '–' + a.end +
           (a.mdStart != null ? ' · md ' + a.mdStart + '–' + a.mdEnd + (a.mdUnico ? '' : ' (múltiple)') : ' · md n/d'));
      const del = document.createElement('button');
      del.className = 'del'; del.textContent = 'eliminar';
      del.addEventListener('click', ()=> removeAnno(a.id));
      fila.append(pos, del);

      item.append(q, coments, add, fila);
      list.appendChild(item);
      autoGrow(ta);
      if (focusNew && a.id === activeId) ta.focus();
    }
  }

  // ===== persistencia local: las anotaciones viven en este navegador, por documento =====
  let CLAVE = 'adinf-lector-anotaciones';
  let cargandoGuardadas = false, listo = false;   // no se guarda nada hasta haber restaurado lo guardado
  function guardar(){
    if (!rawMd || cargandoGuardadas || !listo) return;
    try { localStorage.setItem(CLAVE, JSON.stringify(buildPayload())); } catch(e){}
  }
  function cargarGuardadas(){
    let t = null;
    try { t = localStorage.getItem(CLAVE); } catch(e){}
    if (!t) return;
    cargandoGuardadas = true;
    try { importJSON(t, 'local', true); } finally { cargandoGuardadas = false; }
  }

  function updateChrome(){
    guardar();
    const vacio = annos.length === 0;
    $('export').disabled = vacio || editando;
    $('exportMd').disabled = !rawMd || editando;
    $('editar').disabled = !rawMd;
    if (docName && !editando) $('docname').textContent = docName + (mdServidor != null && rawMd !== mdServidor ? (rawMd === mdExportado ? '  ·  cambios exportados' : '  ·  cambios sin exportar') : '');
    $('recargar').disabled = !docUrl || editando;
    $('contador').textContent = annos.length ? (annos.length + (annos.length === 1 ? ' anotación' : ' anotaciones')) : '';
    
    // Mostramos el contenedor de ajustes si hay documento cargado
    $('controlesVis').style.display = rawMd ? 'block' : 'none';
    
    updateStats();
  }

  // ===== alternar menú de ajustes =====
  $('btnAjustes').addEventListener('click', (e) => {
    e.stopPropagation();
    $('ajustesPanel').classList.toggle('hide');
  });
  document.addEventListener('click', (e) => {
    if (!$('controlesVis').contains(e.target)) {
      $('ajustesPanel').classList.add('hide');
    }
  });

  // ===== ancho de lectura configurable =====
  function aplicarAncho(v){
    v = Math.max(60, Math.min(160, +v || 90));
    docEl.style.maxWidth = v + 'ch';
    $('ancho').value = v;
    $('ancho-v').textContent = v;
  }
  $('ancho').addEventListener('input', ()=>{
    aplicarAncho($('ancho').value);
    try { localStorage.setItem('adinf-ancho', $('ancho').value); } catch(e){}
  });
  (function(){
    let a = null;
    try { a = localStorage.getItem('adinf-ancho'); } catch(e){}
    if (a != null) aplicarAncho(a);
  })();

  function aplicarLetra(v){
    v = Math.max(14, Math.min(26, +v || 17));
    document.documentElement.style.setProperty('--docfs', v + 'px');
    $('letra').value = v; $('letra-v').textContent = v;
  }
  $('letra').addEventListener('input', ()=>{ aplicarLetra($('letra').value); try { localStorage.setItem('adinf-letra', $('letra').value); } catch(e){} });
  (function(){ let v = null; try { v = localStorage.getItem('adinf-letra'); } catch(e){} aplicarLetra(v != null ? v : (estrecho() ? 19 : 17)); })();

  function miles(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
  function updateStats(){
    const el = $('stats');
    if (!rawMd){ el.style.display = 'none'; return; }
    const texto = editando ? editor.value : docText;
    const palabras = (texto.match(/\S+/g) || []).length;
    const pags = Math.ceil(palabras / 500);
    el.style.display = 'block';
    el.textContent = miles(palabras) + ' palabras · '
      + miles(texto.length) + ' caracteres · '
      + pags + (pags === 1 ? ' página' : ' páginas');
  }
  editor.addEventListener('input', updateStats);

  // ===== botón flotante =====
  function showFab(range){
    fab.classList.add('on');
    if (document.body.classList.contains('tablet')){
      fab.style.left = ''; fab.style.top = '';
      return;
    }
    const rects = range.getClientRects();
    const r = rects.length ? rects[rects.length - 1] : range.getBoundingClientRect();
    const fw = fab.offsetWidth || 96, fh = fab.offsetHeight || 40;
    const left = Math.max(8, Math.min(r.right, window.innerWidth - fw - 8));
    let top = r.bottom + 8;
    if (top + fh > window.innerHeight - 8) top = Math.max(8, r.top - fh - 8);
    fab.style.left = left + 'px';
    fab.style.top = top + 'px';
  }
  function hideFab(){ fab.classList.remove('on'); }

  function tabletOn(){ return document.body.classList.contains('tablet'); }
  function setAnotar(on){ const b = $('anotarBtn'); b.disabled = !on; b.classList.toggle('lista', on); }
  function tryShowFab(){
    if (editando || editandoTexto){ hideFab(); setAnotar(false); pending = null; return; }
    const cap = captureSelection();
    if (!cap){ hideFab(); setAnotar(false); pending = null; return; }
    pending = cap;
    if (tabletOn()) setAnotar(true);
    else showFab(cap.range);
  }
  let selTimer = null;
  function tryShowFabDebounced(){ clearTimeout(selTimer); selTimer = setTimeout(tryShowFab, 250); }
  document.addEventListener('selectionchange', tryShowFabDebounced);
  read.addEventListener('mouseup', tryShowFab);
  read.addEventListener('touchend', tryShowFabDebounced);
  fab.addEventListener('click', addAnno);
  $('anotarBtn').addEventListener('click', ()=>{ if (pending){ addAnno(); setAnotar(false); } });
  document.addEventListener('pointerdown', e=>{ if (!fab.contains(e.target)) hideFab(); });
  read.addEventListener('scroll', ()=>{ if (!tabletOn()) hideFab(); });

  // ===== modo tablet =====
  function aplicarTablet(on){
    document.body.classList.toggle('tablet', on);
    $('tablet').classList.toggle('activo', on);
    $('tablet').textContent = on ? 'tablet ✓' : 'tablet';
    hideFab(); tryShowFab();
  }
  $('tablet').addEventListener('click', ()=>{
    const on = !document.body.classList.contains('tablet');
    aplicarTablet(on);
    try { localStorage.setItem('forja-anotador-tablet', on ? '1' : '0'); } catch(e){}
  });
  (function(){
    let pref = null;
    try { pref = localStorage.getItem('forja-anotador-tablet'); } catch(e){}
    const touch = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
    aplicarTablet(pref != null ? pref === '1' : touch);
  })();

  // ===== exportar =====
  function hash32(s){ let h = 5381; for (let i=0;i<s.length;i++) h = ((h<<5) + h + s.charCodeAt(i)) | 0; return (h>>>0).toString(16); }

  function buildPayload(){
    return {
      forjaAnotador: '1',
      generado: new Date().toISOString(),
      documento: {
        nombre: docName,
        hashMd: hash32(rawMd),
        longitudMd: rawMd.length,
        longitudPlano: docText.length
      },
      anotaciones: annos.map(a=>({
        id: a.id,
        creado: a.creado,
        objetivo: {
          exact: a.exact,
          prefix: a.prefix,
          suffix: a.suffix,
          textoPlano: (a.start != null && a.end != null) ? { start: a.start, end: a.end } : null,
          fuenteMd: a.mdStart == null ? null : { start: a.mdStart, end: a.mdEnd, unico: a.mdUnico }
        },
        comentarios: a.comentarios.map(c=>({ texto: c.texto, creado: c.creado }))
      }))
    };
  }

  function exportar(){
    if (!annos.length) return;
    const blob = new Blob([JSON.stringify(buildPayload(), null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const el = document.createElement('a');
    el.href = url;
    el.download = docName.replace(/\.(md|markdown|txt)$/i, '') + '.anotaciones.json';
    el.click();
    URL.revokeObjectURL(url);
  }
  $('export').addEventListener('click', exportar);

  function exportarMd(){
    if (!rawMd) return;
    const base = docName.replace(/\.(md|markdown|txt)$/i, '');
    const m = base.match(/^(.*)_r(\d+)$/);
    const raiz = m ? m[1] : base;
    revs[raiz] = Math.max(revs[raiz] || 0, m ? +m[2] : 0) + 1;
    mdExportado = rawMd;
    const blob = new Blob([rawMd], { type:'text/markdown' });
    const url = URL.createObjectURL(blob);
    const el = document.createElement('a');
    el.href = url;
    el.download = raiz + '_r' + revs[raiz] + '.md';
    el.click();
    URL.revokeObjectURL(url);
  }
  $('exportMd').addEventListener('click', exportarMd);

  // ===== carga de documento =====
  function maybeRender(text, name){
    if (editando && editor.value !== rawMd && !confirm('Hay una edición con cambios sin aplicar; cargar otro documento la descartará. ¿Continuar?')) return false;
    if (annos.length && !confirm('Cargar otro documento descartará las anotaciones actuales sin exportar. ¿Continuar?')) return false;
    render(text, name);
    return true;
  }
  $('cargarJson').addEventListener('click', ()=> $('fileJson').click());
  $('fileJson').addEventListener('change', e=>{ readJsonFile(e.target.files[0]); e.target.value = ''; });

  function avisoDoc(msg){
    $('docname').textContent = msg ? (docName + '  ·  ' + msg) : docName;
    if (msg) setTimeout(()=>{ if (docName) updateChrome(); }, 3500);
  }

  async function recargar(){
    if (!docUrl || editando) return;
    const u = docUrl + (docUrl.includes('?') ? '&' : '?') + '_t=' + Date.now();
    avisoDoc('recargando…');
    try {
      const res = await fetch(u, { cache: 'no-store' });
      if (!res.ok){ avisoDoc('recarga falló (' + res.status + ')'); return; }
      const texto = await res.text();
      if (texto === rawMd){ avisoDoc('sin cambios'); return; }
      const origen = docUrl;
      const r = aplicarNuevoTexto(texto, docName);
      docUrl = origen; mdServidor = texto; updateChrome();
      avisoDoc('actualizado' + (r.huerf ? (' · ' + r.huerf + (r.huerf === 1 ? ' anotación quedó huérfana' : ' anotaciones quedaron huérfanas')) : ''));
    } catch(e){
      avisoDoc('recarga falló: red o CORS');
    }
  }
  $('recargar').addEventListener('click', recargar);

  $('marca').addEventListener('click', ()=>{ location.href = location.pathname; });
  cargarLibro();

  // ===== control dinámico de porcentaje de negro =====
  function aplicarTono(porcentaje){
    porcentaje = Math.max(0, Math.min(100, +porcentaje || 0));
    $('tono').value = porcentaje;
    $('tono-v').textContent = porcentaje + '%';
    
    const root = document.documentElement;
    
    // Si estamos en 0% y no se ha forzado, limpiamos para volver al cálido original.
    if (porcentaje === 0 && !localStorage.getItem('forja-anotador-tono-fijo')) {
      root.style.removeProperty('--paper');
      root.style.removeProperty('--panel');
      root.style.removeProperty('--line');
      root.style.removeProperty('--ink');
      root.style.removeProperty('--ink-dim');
      return;
    }

    // Cálculo: L = 100% es blanco puro, L = 0% es negro puro.
    const L = 100 - porcentaje;
    const textoClaro = L < 55; // Umbral de inversión
    
    root.style.setProperty('--paper', `hsl(0, 0%, ${L}%)`);
    root.style.setProperty('--panel', `hsl(0, 0%, ${L > 50 ? L - 4 : L + 4}%)`);
    root.style.setProperty('--line',  `hsl(0, 0%, ${L > 50 ? L - 12 : L + 12}%)`);

    if (textoClaro) {
      root.style.setProperty('--ink', '#ffffff');
      root.style.setProperty('--ink-dim', '#a0a0a0');
    } else {
      root.style.setProperty('--ink', '#111111');
      root.style.setProperty('--ink-dim', '#555555');
    }
  }

  $('tono').addEventListener('input', ()=>{
    localStorage.setItem('forja-anotador-tono-fijo', '1');
    aplicarTono($('tono').value);
    try { localStorage.setItem('forja-anotador-tono', $('tono').value); } catch(e){}
  });

  (function(){
    let t = null;
    try { t = localStorage.getItem('forja-anotador-tono'); } catch(e){}
    if (t != null) aplicarTono(t);
  })();

  // ===== tema claro/oscuro =====
  function aplicarTema(oscuro){
    document.body.classList.toggle('oscuro', oscuro);
    $('tema').textContent = oscuro ? 'claro' : 'oscuro';
  }
  $('tema').addEventListener('click', ()=>{
    const o = !document.body.classList.contains('oscuro');
    aplicarTema(o);
    try { localStorage.setItem('forja-anotador-tema', o ? 'oscuro' : 'claro'); } catch(e){}
  });
  (function(){
    let pref = null;
    try { pref = localStorage.getItem('forja-anotador-tema'); } catch(e){}
    aplicarTema(pref === 'oscuro');
  })();

  if (!canHL){
    $('contador').title = 'Este navegador no resalta en pantalla, pero las anotaciones y el export funcionan.';
  }
})();
</script>
</body>
</html>
